apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: research-nexus
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containers:
        - image: gcr.io/PROJECT_ID/research-nexus:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 2Gi
              cpu: 2000m
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "PROJECT_ID"
            - name: GOOGLE_CLOUD_LOCATION
              value: "us-central1"
            - name: VERTEX_MODEL
              value: "gemini-2.5-flash"
            # Optional: Configure AlloyDB / PostgreSQL connection string
            # - name: DATABASE_URL
            #   value: "postgresql://postgres:PASSWORD@ALLOYDB_IP:5432/research_nexus"
