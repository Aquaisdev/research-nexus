services:
  backend:
    build: ./backend
    ports: ["8000:8080"]
    environment:
      - PORT=8080
      # To test local PostgreSQL with pgvector, uncomment below:
      # - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/research_nexus
      # To test Vertex AI, set your GCP project:
      # - GOOGLE_CLOUD_PROJECT=your-gcp-project-id
      # - GOOGLE_CLOUD_LOCATION=us-central1
    volumes:
      - ./backend:/app
    depends_on:
      - postgres

  postgres:
    image: pgvector/pgvector:pg16
    ports: ["5432:5432"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=research_nexus
    volumes:
      - pgdata:/var/lib/postgresql/data

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
